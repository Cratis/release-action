name: Release

# Dogfoods this action to release itself: on every merge to main it works out the version from the merged
# pull request's label, creates the GitHub release, and moves the floating major/minor tags so consumers
# tracking `@v1` (or `@v1.2`) pick the release up.
#
# Triggering on push (rather than the pull_request closed event) is deliberate: push to main always runs with
# a full-permission token, including for pull requests from forks. The action finds the merged pull request
# from the commit.

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Release
        id: release
        uses: ./
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # Only the floating alias tags are moved here - never a branch and never the immutable vX.Y.Z tag the
      # release itself is cut with. Alias tags are meant to move; that is how action versioning works.
      - name: Move floating major and minor tags
        if: steps.release.outputs.should-publish == 'true' && steps.release.outputs.prerelease == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          VERSION: ${{ steps.release.outputs.version }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          major="v${VERSION%%.*}"
          minor="v$(printf '%s' "$VERSION" | cut -d. -f1-2)"
          for tag in "$major" "$minor"; do
            # Singular /git/ref/ is an exact match (404 when missing); the plural /git/refs/ does prefix
            # matching and would treat v1 as present whenever any v1.x tag exists.
            if gh api "repos/${REPO}/git/ref/tags/${tag}" >/dev/null 2>&1; then
              gh api -X PATCH "repos/${REPO}/git/refs/tags/${tag}" -f sha="${SHA}" -F force=true >/dev/null
            else
              gh api -X POST "repos/${REPO}/git/refs" -f ref="refs/tags/${tag}" -f sha="${SHA}" >/dev/null
            fi
            echo "Pointed ${tag} at ${SHA}"
          done

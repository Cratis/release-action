name: Release

# Dogfoods this action to release itself. On every merge to main it works out the version from the merged
# pull request's label, tags a lean commit (only the files a consumer needs to run the action), and creates
# the GitHub release - moving the floating major/minor aliases so consumers tracking `@v1` (or `@v1.2`) pick
# it up.
#
# Triggering on push (rather than the pull_request closed event) is deliberate: push to main always runs with
# a full-permission token, including for pull requests from forks. The action finds the merged pull request
# from the commit.

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      # Computes the version and records the decision. Its post step, at the end of the job, creates the
      # GitHub release - which attaches to whichever tag the next step has already pushed.
      - name: Release
        id: release
        uses: ./
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # A consumer of a JavaScript action only ever needs action.yml and the dist bundle it points at, so the
      # release tags point at a commit whose tree is just those (plus LICENSE and README). This keeps the
      # ~4 MB of source, specs and tooling out of every consumer's checkout. The lean commit is parented to the
      # merge commit, so its provenance is intact.
      #
      # Pushing the tags before the action's post step runs means the release it creates attaches to the lean
      # vX.Y.Z tag rather than the full-source merge commit. Only the floating aliases are force-updated; the
      # immutable vX.Y.Z tag is created once.
      - name: Tag the release leanly
        if: steps.release.outputs.should-publish == 'true' && steps.release.outputs.prerelease == 'false'
        env:
          VERSION: ${{ steps.release.outputs.version }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          major="v${VERSION%%.*}"
          minor="v$(printf '%s' "$VERSION" | cut -d. -f1-2)"

          # Build a commit whose tree is only what is needed to run the action.
          export GIT_INDEX_FILE="${RUNNER_TEMP}/lean-index"
          rm -f "$GIT_INDEX_FILE"
          git read-tree --empty
          git add -- action.yml dist LICENSE README.md
          tree="$(git write-tree)"
          commit="$(git commit-tree "$tree" -p "$GITHUB_SHA" -m "Release ${TAG}")"

          for ref in "$TAG" "$major" "$minor"; do
            git push --force origin "${commit}:refs/tags/${ref}"
            echo "Pointed ${ref} at lean commit ${commit}"
          done

name: Build

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # Corepack must be enabled before setup-node, so that setup-node's package-manager probe resolves the
      # Yarn version pinned in package.json rather than the runner's global Yarn.
      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: ".node-version"

      - name: Install dependencies
        run: yarn install --immutable

      - name: Typecheck, lint, test and build
        run: yarn ci

      # The action runs from the committed bundle, so a stale dist/ means the published action does not
      # match the source it was built from.
      - name: Verify dist is up to date
        run: |
          if [ -n "$(git status --porcelain dist)" ]; then
            echo "::error::dist/ is out of date - run 'yarn build' and commit the result."
            git --no-pager diff --stat -- dist
            exit 1
          fi

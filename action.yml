name: "Release"
description: "Works out a semantic version from a merged pull request's label and creates the GitHub release."

inputs:
  github-token:
    description: "Token used for the GitHub API calls the action makes - reading pull requests and creating the release. Defaults to the workflow's GITHUB_TOKEN."
    required: false
    default: ${{ github.token }}
  version:
    description: "Version to release. When set to a real version it overrides working the version out from the pull request and its labels. Empty - or the '0.0.0' placeholder the publish templates default to - means 'work it out from the pull request' and never forces a release."
    required: false
    default: ""
  release-notes:
    description: "Release notes to use when creating the release."
    required: false
    default: ""
  tag-prefix:
    description: "Prefix put in front of the version to form the release tag."
    required: false
    default: "v"
  major-labels:
    description: "Comma-separated label names that mean a major version bump."
    required: false
    default: "major"
  minor-labels:
    description: "Comma-separated label names that mean a minor version bump."
    required: false
    default: "minor"
  patch-labels:
    description: "Comma-separated label names that mean a patch version bump."
    required: false
    default: "patch"
  no-release-labels:
    description: "Comma-separated label names that mean the merge deliberately publishes nothing."
    required: false
    default: "no-release"

outputs:
  should-publish:
    description: "Boolean telling whether or not a publish should be done"
  version:
    description: "Version number to publish with"
  tag:
    description: "The release tag (the version with the tag prefix, e.g. v1.2.3)"
  prerelease:
    description: "Boolean telling whether or not it is a prerelease"
  isolated-for-pull-request:
    description: "Boolean telling whether or not it should be an isolated release for the pull request only"
  previous-version:
    description: "The version the new version was bumped from, or empty when there is no predecessor"
  reason:
    description: "Why the action decided what it decided - 'release' or 'prerelease' when something is published, otherwise one of 'no-pull-request', 'not-merged', 'no-label', 'no-release', 'dependabot', 'already-released', 'no-prerelease-version', 'placeholder-version' or 'error'. Lets a workflow fail on the reasons that cost a release ('no-label', 'error') without failing on the ones that are expected."

branding:
  icon: "tag"
  color: "purple"

runs:
  using: "node24"
  main: "dist/main/index.js"
  post: "dist/post/index.js"
  post-if: "success()"
